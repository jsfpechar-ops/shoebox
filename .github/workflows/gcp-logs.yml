# Test environment diagnostics (owner decision 2026-10-26 [test-env]): prints recent Cloud Run logs,
# the worker VM's container logs (serial console) and the VM state. Run by hand.
name: Google Cloud logs

on:
  workflow_dispatch:
  # Not on main yet, so dispatch alone is not registered: editing this file on phase/0 also runs it.
  push:
    branches: [phase/0]
    paths: ['.github/workflows/gcp-logs.yml']

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Website logs
        run: |
          gcloud run services describe shoebox-test --project sysel0123 --region europe-west1 --format 'value(status.url,status.latestReadyRevisionName)' || true
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="shoebox-test"' \
            --project sysel0123 --limit 40 --freshness 1h --format 'value(timestamp,severity,textPayload,jsonPayload.message)' | cut -c1-300 || true
      - name: Worker VM
        run: |
          gcloud compute instances describe shoebox-worker --zone us-central1-a --project sysel0123 --format 'value(status,networkInterfaces[0].accessConfigs[0].natIP)' || true
          gcloud compute instances get-serial-port-output shoebox-worker --zone us-central1-a --project sysel0123 2>&1 | tail -60 | cut -c1-300
